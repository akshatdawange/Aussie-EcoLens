AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EcoLens notifications stack - SNS topic for tag-based wildlife alerts

Resources:
  EcoLensTagsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: EcoLensTagsTopic
      DisplayName: EcoLens Tag-Based Wildlife Alerts
      Tags:
        - Key: Project
          Value: EcoLens
        - Key: Purpose
          Value: TagNotifications

  EcoLensTagsTopicArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /ecolens/sns/tagsTopicArn
      Type: String
      Value: !Ref EcoLensTagsTopic
      Description: SNS topic ARN for EcoLens tag-based notifications

Outputs:
  EcoLensTagsTopicArn:
    Description: ARN of the EcoLens SNS topic for tag-based notifications
    Value: !Ref EcoLensTagsTopic

  EcoLensTagsTopicArnParameter:
    Description: SSM parameter storing the SNS topic ARN
    Value: /ecolens/sns/tagsTopicArn
