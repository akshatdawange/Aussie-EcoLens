AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EcoLens Part B - Pipeline. Starts with the upload-url function; grows to add the orchestrator + thumbnail later.

Globals:
  Function:
    Timeout: 15
    MemorySize: 128
    Environment:
      Variables:
        ORIGINALS_BUCKET: !Sub "ecolens-originals-${AWS::AccountId}"
        HASHES_TABLE: EcoLensHashes

Resources:

  GetUploadUrlFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ecolens-get-upload-url
      Runtime: python3.12
      CodeUri: ../services/pipeline/get_upload_url/
      Handler: app.lambda_handler
      # Least-privilege: this function can ONLY put objects in originals,
      # and read/write its own dedup table. Nothing else. (rubric 1.3)
      Policies:
        - Statement:
            - Sid: WriteOriginalsBucket
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::ecolens-originals-${AWS::AccountId}/*"
            - Sid: DedupTableAccess
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/EcoLensHashes"
      Events:
        Presign:
          Type: Api
          Properties:
            Path: /uploads/presign
            Method: post

  # Auto-triggered when a file lands in 'originals'. Calls C's AI (or mock) and saves to D's table.
  OrchestratorFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ecolens-orchestrator
      Runtime: python3.12
      CodeUri: ../services/pipeline/orchestrator/
      Handler: app.lambda_handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          MAIN_TABLE: EcoLensMain
          THUMBNAILS_BUCKET: !Sub "ecolens-thumbnails-${AWS::AccountId}"
          THUMBNAIL_FN: ecolens-thumbnail
      Policies:
        - Statement:
            - Sid: ReadOriginalsBucket
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::ecolens-originals-${AWS::AccountId}/*"
            - Sid: WriteMainTable
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/EcoLensMain"
            - Sid: ReadGcpConfigFromSsm
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ecolens/gcp/inferUrl"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ecolens/gcp/sharedSecret"
            - Sid: DecryptSecureString
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
            - Sid: InvokeThumbnailFn
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ecolens-thumbnail"

  # Auto-triggered when an IMAGE lands in 'originals'. Container image (needs OpenCV).
  ThumbnailFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ecolens-thumbnail
      PackageType: Image
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          THUMBNAILS_BUCKET: !Sub "ecolens-thumbnails-${AWS::AccountId}"
      Policies:
        - Statement:
            - Sid: ReadOriginalsBucket
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::ecolens-originals-${AWS::AccountId}/*"
            - Sid: WriteThumbnailsBucket
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::ecolens-thumbnails-${AWS::AccountId}/*"
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../services/pipeline/thumbnail/
      DockerTag: v1

Outputs:
  ApiBaseUrl:
    Description: Base URL of the upload API (give this to Member A).
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  PresignEndpoint:
    Description: The endpoint to POST to for an upload URL.
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/uploads/presign"
